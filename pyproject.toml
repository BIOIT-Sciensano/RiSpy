[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RiSpy"
version = "2.0.0"
description = "Fingerprint generation/detection from WGS data"
readme = "README.md"
authors = [{ name="Amin Zolfaghari", email="bioit@sciensano.be" }]
license = { text = "GNU" }
requires-python = ">=3.10.12,<3.13"
dependencies = [
    "setuptools>=80.9.0",
    "wheel>=0.37.1",
    "typer>=0.17.4",
    "PyYAML>=6.0.3",
    "snakemake>=7.32.4",
    "pulp==2.7.0",
    "openpyxl>=3.1.5",
    "bio>=1.8.0",
    "pandas>=2.3.1,<3",
    "numpy==1.26.4",
    "pysam>=0.23.3",
    "scikit-learn==1.7.2",
    "uv==0.12.18"
]

[project.scripts]
rispy = "rispy_cli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rispy_cli" = [
    "snakefiles/*.smk",
    "templates/*.yaml",
    "data/*",
    "fingerprints/*",
    "test_data/**/*"
]

